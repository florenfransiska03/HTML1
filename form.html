<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
</head>
<body>
    <h2>Data Mahasiswa</h2>
    <form>
        <label>NIM :</label>
        <input type="text" name="nim">
        <br>

        <label>Nama :</label>
        <input type="text" name="nama">
        <br>

        <label>Tgl Lahir (dd-mm-yyyy) :</label>
        <input type="date" name="tanggal_lahir">
        <br>

        <label>Jenis Kelamin :</label>
        <input type="radio" name="jenis_kelamin" value="Laki-Laki">
        Laki-Laki

        <input type="radio" name="jenis_kelamin" value="Perempuan">
        Perempuan
        <br>

        <label>Alamat di Bandung :</label>
        <textarea name="alamat" rows="4" cols="30" style="vertical-align: middle;"></textarea>
        <br>

        <label>Tinggal di :</label>
        <select name="tempat_tinggal">
            <option value="">--pilih--</option>
            <option value="Kos/kontrakan">Kos/kontrakan</option>
            <option value="Rumah saudara">Rumah saudara</option>
            <option value="Rumah orang tua">Rumah orang tua</option>
        </select>
        <br>

        <label>Pilih 2 hobi yang paling disukai :</label>
        <br>

        <input type="checkbox" name="hobi" value="Science">
        Science
        <br>

        <input type="checkbox" name="hobi" value="Technology">
        Technology
        <br>

        <input type="checkbox" name="hobi" value="Art">
        Art
        <br>

        <input type="checkbox" name="hobi" value="Sport">
        Sport
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
